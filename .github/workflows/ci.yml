name: CI — Build & Test

on:
  pull_request:
    branches: [main, master, develop, integration/develop-pr-stack-2026-09-30]
  push:
    branches: [main, master, develop, integration/develop-pr-stack-2026-09-30]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests with coverage
        run: |
          dotnet test --no-build --configuration Release --verbosity normal \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura \
               DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.ExcludeByAttribute=GeneratedCodeAttribute

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: |
          reportgenerator \
            -reports:"**/coverage.cobertura.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:"Html;TextSummary;Cobertura"

      - name: Report coverage (80% advisory)
        run: |
          SUMMARY=$(cat coverage-report/Summary.txt)
          echo "$SUMMARY"
          LINE_COVERAGE=$(echo "$SUMMARY" | grep "Line coverage" | grep -oP '[\d.]+' | head -1)
          echo "Line coverage: ${LINE_COVERAGE}%"
          if (( $(echo "$LINE_COVERAGE < 80" | bc -l) )); then
            echo "::warning::Coverage ${LINE_COVERAGE}% is below 80%; coverage is reported but does not block this functional remediation."
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'

  security-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Check vulnerable packages
        run: |
          echo "## Dependency Vulnerability Scan" >> $GITHUB_STEP_SUMMARY
          OUTPUT=$(dotnet list package --vulnerable --include-transitive 2>&1)
          echo "$OUTPUT"
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$OUTPUT" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if echo "$OUTPUT" | grep -qi "has the following vulnerable packages"; then
            echo "::error::Vulnerable packages detected! Review and update dependencies."
            exit 1
          fi
          echo "✅ No vulnerable packages found." >> $GITHUB_STEP_SUMMARY

  frontend-e2e-playwright:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Install QA Automation Dependencies
        working-directory: ./tests/frontend
        run: npm ci

      - name: Install Playwright Browsers & System Dependencies
        working-directory: ./tests/frontend
        run: npx playwright install --with-deps chromium firefox

      - name: Run Playwright UI E2E with mocked API contracts
        working-directory: ./tests/frontend
        run: npm test

      - name: Run Cypress UI E2E with mocked API contracts
        working-directory: ./frontend
        run: npm run cy:run

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/frontend/playwright-report/
          retention-days: 15
